<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zambari: projects</title>
<meta name="description" content="Tools for music, Elektron devices and Unity by zambari.">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0db; --accent: #d9480f; --accent-text: #ffffff; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa2;
      --line: #2c2c31; --accent: #ff7a3d; --accent-text: #141416; --chip: #26262b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  header a { color: inherit; }
  .grid {
    display: grid; gap: 24px; margin-top: 36px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .shot { display: block; aspect-ratio: 16 / 10; background: var(--chip); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card h2 { margin: 0; font-size: 20px; }
  .tagline { margin: 0; color: var(--muted); font-size: 14px; }
  .desc { margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; align-items: center; }
  .btn {
    display: inline-block; padding: 7px 14px; border-radius: 8px; font-size: 14px;
    text-decoration: none; border: 1px solid var(--line); color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn:hover { filter: brightness(1.08); }
  .version { font-size: 13px; color: var(--muted); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>zambari</h1>
    <p>Tools for music gear, Elektron devices and Unity. Source on <a href="https://github.com/zambari">GitHub</a>.</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>Downloads are unsigned builds. On macOS, the first launch needs System Settings → Privacy &amp; Security → Open Anyway.</footer>
</div>

<script src="projects.js"></script>
<script>
  const grid = document.getElementById('grid');
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  };
  const link = (label, url, cls) => {
    const a = el('a', 'btn' + (cls ? ' ' + cls : ''), label);
    a.href = url;
    return a;
  };
  // "Sample-Manager-0.9.0-macOS.zip" -> "macOS"
  const platformOf = name =>
    /mac|darwin|\.dmg$/i.test(name) ? 'macOS' :
    /win|\.exe$|\.msi$/i.test(name) ? 'Windows' :
    /linux|\.appimage$|\.deb$/i.test(name) ? 'Linux' : name;

  for (const p of window.PROJECTS) {
    const repoUrl = 'https://github.com/' + p.repo;
    const card = el('article', 'card');

    if (p.image) {
      const a = el('a', 'shot');
      a.href = repoUrl;
      const img = el('img');
      img.src = p.image; img.alt = p.imageAlt || p.name; img.loading = 'lazy';
      a.append(img);
      card.append(a);
    }

    const body = el('div', 'body');
    body.append(el('h2', null, p.name));
    if (p.tagline) body.append(el('p', 'tagline', p.tagline));
    if (p.description) body.append(el('p', 'desc', p.description));
    if (p.tags && p.tags.length) {
      const tags = el('div', 'tags');
      p.tags.forEach(t => tags.append(el('span', null, t)));
      body.append(tags);
    }

    const actions = el('div', 'actions');
    const downloads = el('span');
    downloads.style.display = 'contents';
    actions.append(downloads);
    actions.append(link('Source', repoUrl));
    (p.links || []).forEach(l => actions.append(link(l.label, l.url)));
    body.append(actions);
    card.append(body);
    grid.append(card);

    if (p.releases) {
      const fallback = () => downloads.replaceChildren(link('Downloads', repoUrl + '/releases', 'primary'));
      fallback();
      fetch('https://api.github.com/repos/' + p.repo + '/releases/latest')
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(rel => {
          if (!rel.assets || !rel.assets.length) return;
          const items = rel.assets.map(a => link('Download for ' + platformOf(a.name), a.browser_download_url, 'primary'));
          items.push(el('span', 'version', rel.tag_name));
          downloads.replaceChildren(...items);
        })
        .catch(() => {});
    }
  }
</script>
</body>
</html>
